<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Reflex - Contact</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" async></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header>
    <nav>
        <a href="Accueil.html">Accueil</a>
        <a href="Articles.html">Articles</a>
        <a href="Contact.html" class="active">Contact</a>
        <a href="Apropos.html">A propos</a>
    </nav>
</header>
<main>
    <div>
        <form class="formulaire">
            <fieldset name="Vos informations" id="informations">
                <legend>Vos informations</legend>
                <div id="container-genre">
                    <label for="genre">Genre :</label>
                    <select name="genre" id="genre" required>
                        <option value="">Choisissez un genre</option>
                        <option value="Homme">Homme</option>
                        <option value="Femme">Femme</option>
                    </select>
                </div>
                <div>
                    <label for="nom">Nom :</label>
                    <input type="text" name="nom" id="nom" required>
                </div>
                <div>
                    <label for="prenom">Prénom :</label>
                    <input type="text" name="prenom" id="prenom" required>
                </div>
                <div>
                    <label for="date">Date de naissance :</label>
                    <input type = "date" name="date" id="date" required>
                </div>
                <div id="adresse-mail">
                    <label for="mail">Adresse mail :</label>
                    <input type="email" name="mail" id="mail" required>
                </div>
                <div>
                    <label for="exemple">Donnez-nous un commentaire :</label>
                    <textarea id="exemple" name="exemple"></textarea>
                </div>
                <div id="bouton-formulaire">
                    <button type="submit" class="bouton">Envoyer</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div class="post-form">
        <p>merci le fratelo pour ton contact !!</p>
    </div>
</main>
<footer>
    <p>© 2026 Mark RABEMANANTSOA - Lucas DAUGAN<br>
        Tous droits réservés.</p>
    <a href="Apropos.html">En savoir plus ?</a>
</footer>
</body>
</html>
