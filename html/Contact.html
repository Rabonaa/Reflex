<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Reflex - Contact</title>
        <link rel="stylesheet" href="../css/styles.css">
        <script src="../js/script.js" async></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="Accueil.html">Accueil</a>
                <a href="Articles.html">Articles</a>
                <a href="Contact.html" class="active">Contact</a>
                <a href="Apropos.html">A propos</a>
            </nav>
        </header>
        <main>
            <div>
                <fieldset name="Vos informations" id="informations">
                    <legend>Vos informations</legend>
                    <form method="post" name="Quiz" action="#" class="box" id="QuizId" onsubmit="return false">

                        <div>
                            <label for="nom">Nom :</label>
                            <input type="text" name="nom" id="nom">
                        </div>
                        <div>
                            <label for="prenom">Prénom :</label>
                            <input type="text" name="prenom" id="prenom">
                        </div>
                        <div>
                            <label for="date">Date de naissance :</label>
                            <input type = "date" name="date" id="date">
                        </div>
                        <div>
                            <label for="mail">Adresse mail :</label>
                            <input type="email" name="mail" id="mail">
                        </div>
                        <div>
                            <label for="genre">genre :</label>
                            <select name="genre" id="genre">
                                <option value="">Choisissez un genre</option>
                                <option value="Homme">Homme</option>
                                <option value="Femme">Femme</option>
                            </select>
                            <p>Donnez-nous un commentaire : </p>
                            <textarea id="exemple" name="exemple"></textarea><label for="exemple"></label>
                        </div>
                        <div>
                            <input type= "button" value =" envoyer " class="button" id="envoyer" onclick=""><label for="envoyer"></label>
                        </div>

                    </form>
                </fieldset>
            </div>

            <div>
                <p>merci le fratelo pour ton contact !!</p>
            </div>
        </main>
        <footer>
            <p>©️2026 Mark RABEMANANTSOA - Lucas DAUGAN<br>
                Tous droits réservés.</p>
            <a href="Apropos.html">En savoir plus</a>
        </footer>
    </body>
</html>
